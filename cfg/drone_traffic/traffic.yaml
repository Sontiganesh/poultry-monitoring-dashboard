reference_width: 1920
reference_height: 1080
occupancy_resolution_width: 480
aggregation_interval_seconds: 10
minimum_observation_duration_seconds: 3
smoothing_window_seconds: 3
ema_alpha: 0.15
hysteresis: 0.01
minimum_state_duration_seconds: 3
minimum_detection_frames_in_window: 50
# Ultralytics defaults max_det to 300. Dense frames already carry ~134 tracked
# vehicles at a 0.25 score floor, and the lower floor ByteTrack needs for its
# recovery stage pushes well past that, so an unraised cap would silently clip
# detections and manufacture the very track losses we are trying to remove.
max_detections: 600
camera_motion:
  enabled: false
occupancy:
  red_occupancy_pct: 60
congestion:
  weights:
    occupancy: 0.6
    speed: 0.4
  thresholds:
    green: 0.17
    yellow: 0.70
speed:
  free_flow_kmh: 60
  speed_window_seconds: 2
  ground_homography: null
# Ground-truth scale. ASSUMPTION: each carriageway is 7.0m wide (two 3.5m lanes).
# Change road_width_m to the surveyed width and re-run - every km/h scales
# linearly with it and every veh/km scales inversely, so a 10% width error is a
# 10% speed error. Only used when ground_homography is null.
scale:
  road_width_m: 7.0
  lanes_per_direction: 2
  # Longitudinal correction, derived from observed car length, NOT surveyed.
  # A first pass at correction 1.0 measured the median car at 1.03m against a
  # 4.4m reference, so travel-direction distance was foreshortened 4.25x by the
  # isotropic assumption on this oblique view. Applying it makes speed, segment
  # length and density self-consistent with real vehicle sizes. Replace this and
  # road_width_m with surveyed values when available; note that once the factor
  # comes from car length, scale_diagnostics can no longer independently confirm
  # it - only a known ground distance can.
  longitudinal_correction: 4.25
visualization:
  show_boxes: true
  show_ids: true
  show_directions: false
  show_trajectories: false
  show_road_boundaries: true
  show_traffic_lines: true
  show_labels: true
  traffic_line_thickness: 16
