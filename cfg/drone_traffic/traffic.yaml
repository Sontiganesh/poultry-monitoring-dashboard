- segment_id: R1_B
  subdivide_into: 4
  # Opposing carriageway: number 4..1 down the frame, mirroring R1_A's 1..4 so
  # the two sides are not both numbered top-to-bottom.
  # NOTE: this is a spatial mirror, not a travel-direction alignment. Measured
  # motion has BOTH carriageways running down-frame (A: 37% down vs 4% up), which
  # contradicts R1_A's travel_vector below and inflates A's counterflow counts.
  # Resolve that travel_vector first; whether the numbering should then follow
  # flow on both sides is a separate decision.
  reverse_numbering: true
