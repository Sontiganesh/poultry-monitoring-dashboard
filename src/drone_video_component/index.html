<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body { margin: 0; padding: 0; font-family: sans-serif; color: #202124; }
    video { display: block; width: 100%; max-height: 68vh; background: #111; border-radius: 8px; }
    .status { padding: 6px 2px; color: #5f6368; font-size: 13px; }
  </style>
</head>
<body>
  <video id="video" controls playsinline></video>
  <div class="status" id="status">Loading video…</div>
  <script>
    const video = document.getElementById("video");
    const status = document.getElementById("status");
    let lastSent = -1;
    let loopEnabled = true;

    function send(type, extra = {}) {
      window.parent.postMessage({isStreamlitMessage: true, type, ...extra}, "*");
    }
    function setValue(seconds, force = false) {
      const rounded = Math.floor(Number(seconds) || 0);
      if (!force && rounded === lastSent) return;
      lastSent = rounded;
      send("streamlit:setComponentValue", {value: Number(seconds) || 0, dataType: "json"});
      status.textContent = `Playback time ${Math.floor(seconds / 60)}:${String(Math.floor(seconds % 60)).padStart(2, "0")} · analytics update with the playing frame`;
    }
    video.addEventListener("timeupdate", () => setValue(video.currentTime));
    video.addEventListener("seeked", () => setValue(video.currentTime, true));
    video.addEventListener("loadedmetadata", () => {
      if (loopEnabled) video.loop = true;
      setValue(video.currentTime, true);
    });
    video.addEventListener("error", () => { status.textContent = "This video could not be loaded."; });
    window.addEventListener("message", (event) => {
      const message = event.data;
      if (!message || message.type !== "streamlit:render" || !message.args) return;
      const args = message.args;
      loopEnabled = Boolean(args.loop);
      video.loop = loopEnabled;
      if (args.video_url && video.dataset.src !== args.video_url) {
        video.pause();
        video.dataset.src = args.video_url;
        video.src = args.video_url;
        video.load();
      }
    });
    send("streamlit:componentReady", {apiVersion: 1});
    send("streamlit:setFrameHeight", {height: 520});
  </script>
</body>
</html>
